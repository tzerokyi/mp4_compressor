[package]
name = "mp4-compressor"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
description = "Native offline MP4 compressor for compatible social video"
license = "MIT"

[dependencies]
eframe = { version = "=0.33.2", default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata]
notes = "GUI is native egui; ffmpeg and ffprobe are required executables on PATH."
