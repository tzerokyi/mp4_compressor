name: Rust CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ripgrep xvfb libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev ffmpeg
      - name: Verify project files
        run: test -f Cargo.toml && test -f src/main.rs
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Public preflight
        run: bash scripts/preflight.sh
      - name: GUI startup smoke test under Xvfb
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 8s target/release/mp4-compressor > /tmp/mp4-compressor-gui.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then cat /tmp/mp4-compressor-gui.log; exit 1; fi
      - name: Capture UI screenshot
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c '
            LIBGL_ALWAYS_SOFTWARE=1 target/release/mp4-compressor &
            pid=$!
            sleep 4
            ffmpeg -hide_banner -loglevel error -f x11grab -video_size 1280x1024 -i "$DISPLAY" -frames:v 1 ui-screenshot.png -y
            kill "$pid" || true
            wait "$pid" || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mp4-compressor-ui-preview
          path: ui-screenshot.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mp4-compressor-linux
          path: target/release/mp4-compressor
      - name: Commit formatting and lock file after successful test
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "style: format v0.4.0 sources and lockfile"
            git push origin HEAD:main
          fi
  publish:
    name: Publish v0.4.0 RC4
    needs: build
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: v0.4.0-rc.4') }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mp4-compressor-linux
          path: dist
      - name: Publish Linux executable and icon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv dist/mp4-compressor dist/mp4-compressor-linux-x86_64
          chmod 0755 dist/mp4-compressor-linux-x86_64
          cp assets/mp4-compressor-256.png dist/
          cp assets/mp4-compressor.desktop dist/
          tar -czf mp4-compressor-linux-x86_64.tar.gz -C dist .
          tar -tvzf mp4-compressor-linux-x86_64.tar.gz | grep -q '^-rwx.*mp4-compressor-linux-x86_64$'
          gh release create v0.4.0-rc.4             dist/mp4-compressor-linux-x86_64             dist/mp4-compressor-256.png             dist/mp4-compressor.desktop             mp4-compressor-linux-x86_64.tar.gz             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "mp4 compressor v0.4.0 RC4 (Linux)"             --notes "Canonical mp4-compressor naming is used throughout the source, launcher, CI artifacts, and Linux release. FFmpeg and ffprobe are required. KDE Wayland uses XWayland."             --prerelease
